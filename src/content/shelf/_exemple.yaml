# Modèle d'une fiche de l'étagère (ignoré car son nom commence par « _ »).
# Copie ce fichier sous un autre nom, par exemple dune-herbert.yaml, puis remplis-le.
type: book # book (livre), manga, film, series (série) ou album
title: Titre de l'œuvre
creator: Auteur, réalisateur ou artiste
year: 1965 # année de sortie, facultatif
progress: Tomes 1 à 3 # où tu en es (tomes, saisons), facultatif
rating: 4 # note sur 5, facultatif
finished: 2026-11-19 # date à laquelle tu l'as terminé (ou lu le dernier tome) ; 2025-05 ou 2015 si tu ne connais que le mois ou l'année
review: Ton avis en deux ou trois lignes. # facultatif
cover: ./covers/titre-de-l-oeuvre.jpg # image à droite, à mettre dans src/content/shelf/covers/, facultatif
# effect: papercut # effet spécial sur la couverture (papercut : saccades façon papier découpé ; elastic : étirement façon caoutchouc ; bullets : impacts de balle ; slash : coupée en deux ; eclipse : éclipse rouge ; fourth-wall : bulle qui parle au visiteur ; apple : pomme croquée ; portal : portail aspirant ; snap : poussière après un claquement de doigts ; glyph : cercle magique à l'encre ; upside-down : bascule dans le Monde à l'envers ; crack : écran fissuré ; comet : comète qui se scinde ; spotlight : projecteur qui tombe du ciel), facultatif
